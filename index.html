<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ələs Bayramlı | Rəsmi Sayt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #818cf8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh; }
        .container { max-width: 600px; width: 100%; animation: fadeUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { font-size: 16px; color: var(--primary); font-weight: 600; margin-bottom: 15px; }
        
        .card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--text-main); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .card-title i { color: var(--primary); }
        p.education-text { color: var(--text-secondary); line-height: 1.7; font-size: 15px; }

        .links-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .link-btn { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(255,255,255,0.03); border-radius: 12px; color: var(--text-main); text-decoration: none; font-weight: 500; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05); }
        .link-btn .left-side { display: flex; align-items: center; gap: 12px; }
        .link-btn i { font-size: 20px; }
        .link-btn i.fa-chevron-right { font-size: 14px; color: var(--text-secondary); transition: transform 0.3s; }
        
        .link-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .link-btn:hover i.fa-chevron-right { transform: translateX(4px); color: var(--text-main); }
        
        .btn-insta:hover i.fa-instagram { color: #e1306c; }
        .btn-yt:hover i.fa-youtube { color: #ff0000; }
        .btn-mail:hover i.fa-envelope { color: var(--primary); }
        .footer { text-align: center; margin-top: 30px; font-size: 13px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ələs Bayramlı</h1>
            <div class="subtitle">Biznes İdarəetməsi (UNEC)</div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-graduation-cap"></i> Təhsil</div>
            <p class="education-text">
                Azərbaycan Dövlət İqtisad Universitetində (UNEC) İşletme ixtisası üzrə təhsil alıram.
            </p>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-link"></i> Əlaqə & Sosial Şəbəkələr</div>
            <div class="links-grid">
                <a href="https://instagram.com/iambayramlig" target="_blank" class="link-btn btn-insta">
                    <div class="left-side"><i class="fa-brands fa-instagram"></i> Instagram (@iambayramlig)</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="https://youtube.com/@alas_beats" target="_blank" class="link-btn btn-yt">
                    <div class="left-side"><i class="fa-brands fa-youtube"></i> YouTube (alas_beats)</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="mailto:contact@alasbayramli.me" class="link-btn btn-mail">
                    <div class="left-side"><i class="fa-solid fa-envelope"></i> contact@alasbayramli.me</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>

        <div class="footer">
            © 2026 alasbayramli.me
        </div>
    </div>
</body>
</html>
